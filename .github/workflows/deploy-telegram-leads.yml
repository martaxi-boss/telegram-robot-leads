name: Telegram Leads isolated VPS installation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-telegram-leads.yml"

permissions:
  contents: read

concurrency:
  group: telegram-leads-isolated-vps-install
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-certify exact deployment source
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/deploy_project_only.py scripts/activate_project_only.py scripts/project_hygiene.py scripts/organic_growth.py scripts/safe_runtime.py
          bash -n scripts/telegram-robot-leads-status.sh

  install-only-telegram-leads:
    needs: certify
    runs-on: ubuntu-latest
    env:
      LEADS_HOST: ${{ secrets.TELEGRAM_LEADS_SSH_HOST }}
      LEADS_USER: ${{ secrets.TELEGRAM_LEADS_SSH_USER }}
      LEADS_PORT: ${{ secrets.TELEGRAM_LEADS_SSH_PORT }}
      LEADS_KEY: ${{ secrets.TELEGRAM_LEADS_SSH_KEY }}
      LEADS_KNOWN_HOSTS: ${{ secrets.TELEGRAM_LEADS_SSH_KNOWN_HOSTS }}
      LEADS_PM2_HOME: ${{ secrets.TELEGRAM_LEADS_PM2_HOME }}
      EXPECTED_INSTALLED: d8736bd359de795182ee717448c93df2977d0a44
    steps:
      - uses: actions/checkout@v4

      - name: Validate dedicated Telegram Leads SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in LEADS_HOST LEADS_USER LEADS_KEY LEADS_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::BLOCKED: configure ${name} in THIS repository's dedicated Actions secrets."
              exit 2
            fi
          done
          [[ "$LEADS_HOST" =~ ^[a-zA-Z0-9._-]+$ ]] || { echo "::error::Invalid SSH host"; exit 2; }
          [[ "$LEADS_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "::error::Invalid SSH user"; exit 2; }
          port="${LEADS_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && ((10#$port >= 1 && 10#$port <= 65535)) || { echo "::error::Invalid SSH port"; exit 2; }
          if [[ -n "$LEADS_PM2_HOME" ]]; then
            [[ "$LEADS_PM2_HOME" =~ ^/[a-zA-Z0-9/._-]+$ ]] && [[ "$LEADS_PM2_HOME" != *..* ]] || { echo "::error::Invalid dedicated PM2_HOME"; exit 2; }
          fi

      - name: Release only allowlisted Telegram Leads code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/telegram-leads-ssh-key"
          known="$RUNNER_TEMP/telegram-leads-known-hosts"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$LEADS_KEY" > "$key"
          printf '%s\n' "$LEADS_KNOWN_HOSTS" > "$known"
          chmod 600 "$key" "$known"
          port="${LEADS_PORT:-22}"
          sha="$GITHUB_SHA"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 2
          dest="$LEADS_USER@$LEADS_HOST"
          ssh_flags=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10 -p "$port")
          scp_flags=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o ConnectTimeout=10 -P "$port")
          bundle="$RUNNER_TEMP/telegram-leads-runtime.tgz"

          # Never package credentials, databases, unrelated repos or unreviewed files.
          tar -czf "$bundle" -- \
            scripts/lead_health.py \
            scripts/leads_operational_report.py \
            scripts/operation_policy.py \
            scripts/organic_growth.py \
            scripts/project_hygiene.py \
            scripts/safe_runtime.py \
            scripts/telegram-robot-leads-status.sh \
            scripts/deploy_project_only.py \
            scripts/activate_project_only.py

          upload="/opt/telegram-robot-leads/.telegram-leads-release-$sha.tgz"
          installer="/opt/telegram-robot-leads/.telegram-leads-installer-$sha.py"
          ssh "${ssh_flags[@]}" "$dest" \
            "test \"\$(id -u)\" = 0 && test -d /opt/telegram-robot-leads && test ! -L /opt/telegram-robot-leads && test -d /root/project-secrets/telegram-robot-leads && test ! -e '$upload' && test ! -L '$upload' && test ! -e '$installer' && test ! -L '$installer'"
          scp "${scp_flags[@]}" "$bundle" "$dest:$upload"
          scp "${scp_flags[@]}" scripts/deploy_project_only.py "$dest:$installer"

          # Existing SHA guard, owner-only two sessions and private backup.
          ssh "${ssh_flags[@]}" "$dest" \
            "/usr/bin/python3 '$installer' --bundle '$upload' --commit '$sha' --expected-installed '$EXPECTED_INSTALLED' --apply --confirm-telegram-only"

          # Remove only these two generated files from the Telegram project root.
          ssh "${ssh_flags[@]}" "$dest" \
            "rm -f -- '$upload' '$installer'"

          # Delete only generated bytecode; never secrets, journals, state or venv.
          ssh "${ssh_flags[@]}" "$dest" \
            "/usr/bin/python3 /opt/telegram-robot-leads/scripts/project_hygiene.py --apply --confirm-telegram-only"

          if [[ -z "$LEADS_PM2_HOME" ]]; then
            echo "::warning::Code staged and Telegram-only hygiene executed. Not activated: dedicated PM2_HOME is not configured."
            exit 0
          fi
          # Restart only the one verified worker in the existing correct PM2 daemon.
          ssh "${ssh_flags[@]}" "$dest" \
            "/usr/bin/python3 /opt/telegram-robot-leads/scripts/activate_project_only.py --pm2-home '$LEADS_PM2_HOME' --expected-source '$sha' --apply --confirm-telegram-only"

          # Read-only redacted report: no PM2 discovery daemon and no Telegram calls.
          ssh "${ssh_flags[@]}" "$dest" \
            "/opt/telegram-robot-leads/.venv/bin/python /opt/telegram-robot-leads/scripts/leads_operational_report.py --expected-source '$sha' --no-pm2"
