name: Telegram Leads isolated VPS installation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deploy-telegram-leads.yml"
      - "scripts/**"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-telegram-leads.yml"

permissions:
  contents: read

concurrency:
  group: telegram-leads-isolated-vps-install
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-certify exact deployment source
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile scripts/deploy_project_only.py scripts/activate_project_only.py scripts/project_hygiene.py scripts/organic_growth.py scripts/safe_runtime.py
          bash -n scripts/telegram-robot-leads-status.sh

  install-only-telegram-leads:
    if: github.event_name != 'pull_request'
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSHPASS: ${{ secrets.TELEGRAM_LEADS_SSH_PASSWORD }}
      LEADS_PM2_HOME: ${{ secrets.TELEGRAM_LEADS_PM2_HOME }}
      EXPECTED_INSTALLED: d8736bd359de795182ee717448c93df2977d0a44
    steps:
      - uses: actions/checkout@v4
      - name: Validate project-only password SSH and pinned host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "martaxi-boss/telegram-robot-leads" ]] || exit 2
          if [[ -z "${SSHPASS:-}" ]]; then
            echo "::error::Configure TELEGRAM_LEADS_SSH_PASSWORD in Telegram Leads Actions secrets."
            exit 2
          fi
          if [[ -n "$LEADS_PM2_HOME" ]]; then
            [[ "$LEADS_PM2_HOME" =~ ^/[a-zA-Z0-9/._-]+$ ]] && [[ "$LEADS_PM2_HOME" != *..* ]] || { echo '::error::Invalid PM2_HOME'; exit 2; }
          fi
          known="$RUNNER_TEMP/telegram-leads-pinned-host"
          ssh-keyscan -T 15 -t ed25519 146.59.145.3 2>/dev/null > "$known" || { echo '::error::SSH host unavailable'; exit 2; }
          chmod 600 "$known"
          observed="$(ssh-keygen -lf "$known" -E sha256 | awk '{print $2}')"
          [[ "$observed" == 'SHA256:Q7y5zs6sXWHtznlMQS/IQjcqPKdr7YEku1hWlNLvdxc' ]] || { echo '::error::SSH host identity mismatch'; exit 2; }
          ssh-keygen -F 146.59.145.3 -f "$known" >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -e ssh -T -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 \
            -o ConnectTimeout=10 ubuntu@146.59.145.3 'sudo -n id -u' | grep -qx 0

      - name: Release only allowlisted Telegram Leads code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          known="$RUNNER_TEMP/telegram-leads-pinned-host"
          dest='ubuntu@146.59.145.3'
          ssh_opts=(-T -o PreferredAuthentications=password -o PubkeyAuthentication=no
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known"
            -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519
            -o ConnectTimeout=10)
          sha="$GITHUB_SHA"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || exit 2
          bundle="$RUNNER_TEMP/telegram-leads-runtime.tgz"
          tar -czf "$bundle" -- \
            scripts/lead_health.py \
            scripts/leads_operational_report.py \
            scripts/operation_policy.py \
            scripts/organic_growth.py \
            scripts/project_hygiene.py \
            scripts/safe_runtime.py \
            scripts/telegram-robot-leads-status.sh \
            scripts/deploy_project_only.py \
            scripts/activate_project_only.py
          upload="/opt/telegram-robot-leads/.telegram-leads-release-$sha.tgz"
          installer="/opt/telegram-robot-leads/.telegram-leads-installer-$sha.py"
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n sh -c 'test -d /opt/telegram-robot-leads && test ! -L /opt/telegram-robot-leads && test -d /root/project-secrets/telegram-robot-leads'"
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n sh -c 'test ! -e \"$upload\" && test ! -L \"$upload\" && test ! -e \"$installer\" && test ! -L \"$installer\"'"
          cleanup() {
            sshpass -e ssh "${ssh_opts[@]}" "$dest" \
              "sudo -n rm -f -- '$upload' '$installer'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n sh -c 'umask 077; cat > \"$upload\"'" < "$bundle"
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n sh -c 'umask 077; cat > \"$installer\"'" < scripts/deploy_project_only.py
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n /usr/bin/python3 '$installer' --bundle '$upload' --commit '$sha' --expected-installed '$EXPECTED_INSTALLED' --apply --confirm-telegram-only"
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n /usr/bin/python3 /opt/telegram-robot-leads/scripts/project_hygiene.py --apply --confirm-telegram-only"
          if [[ -z "$LEADS_PM2_HOME" ]]; then
            echo '::warning::Telegram-only code staged; worker not restarted because TELEGRAM_LEADS_PM2_HOME is unset.'
            exit 0
          fi
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n /usr/bin/python3 /opt/telegram-robot-leads/scripts/activate_project_only.py --pm2-home '$LEADS_PM2_HOME' --expected-source '$sha' --apply --confirm-telegram-only"
          sshpass -e ssh "${ssh_opts[@]}" "$dest" \
            "sudo -n /opt/telegram-robot-leads/.venv/bin/python /opt/telegram-robot-leads/scripts/leads_operational_report.py --expected-source '$sha' --no-pm2"
