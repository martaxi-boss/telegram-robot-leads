name: Telegram Leads safe checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "ecosystem.config.js"
      - "tests/**"
      - "docs/OPT_IN_GROWTH.md"
      - "ecosystem.growth.example.config.js"
      - ".github/workflows/safe-growth-checks.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "ecosystem.config.js"
      - "tests/**"
      - "docs/OPT_IN_GROWTH.md"
      - "ecosystem.growth.example.config.js"
      - ".github/workflows/safe-growth-checks.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation (including legacy main)
        run: python -m py_compile main.py scripts/lead_health.py scripts/optin_join_links.py scripts/growth_store.py scripts/growth_tracker.py scripts/telethon_sessions.py
      - name: Local tests (no external credentials)
        run: python -m unittest discover -s tests -v
      - name: Canonical and legacy status shells parse safely
        run: bash -n scripts/telegram-robot-leads-status.sh scripts/telegram-iptvpn-status.sh
      - name: PM2 config syntax (inert example, no deployment)
        run: node --check ecosystem.growth.example.config.js
