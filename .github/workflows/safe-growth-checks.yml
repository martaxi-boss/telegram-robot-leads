name: Telegram Leads safe checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "ecosystem.config.js"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/safe-growth-checks.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "main.py"
      - "requirements.txt"
      - "ecosystem.config.js"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/safe-growth-checks.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax validation
        run: >-
          python -m py_compile
          main.py
          scripts/lead_health.py
          scripts/optin_join_links.py
          scripts/growth_store.py
          scripts/growth_tracker.py
          scripts/telethon_sessions.py
          scripts/operation_policy.py
          scripts/safe_runtime.py
          scripts/public_group_discovery.py
          scripts/public_group_review.py
          scripts/leads_operational_report.py
      - name: Local tests
        run: python -m unittest discover -s tests -v
      - name: Status shells parse safely
        run: bash -n scripts/telegram-robot-leads-status.sh scripts/telegram-iptvpn-status.sh
      - name: Canonical PM2 config syntax
        run: node --check ecosystem.config.js
